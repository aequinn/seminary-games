<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}img{max-width:100%}[hidden]{display:none!important}
</style>
<title>One in a Millennium</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
/* Layout: an 8-bit game board under a bright pixel sky. Chunky ink-outlined panels with hard drop shadows,
   a pixel display face for headings, points and buttons, and a readable terminal face for answers.
   One bright look on purpose: it stays punchy on a projector. */
:root {
  --sky: #4FC3F7;
  --sky-deep: #2FA8E8;
  --ink: #1B1035;
  --paper: #FFFBEA;
  --paper-2: #FFF0B8;
  --muted: #5B4E7A;
  --pink: #FF3D9A;
  --yellow: #FFD23F;
  --green: #5FD43A;
  --blue: #2F8CFF;
  --purple: #A66BFF;
  --orange: #FF8A3D;
  --red: #FF4B4B;
  --t1: #FFFFFF;
  --t2: #5FD43A;
  --t3: #3FA9FF;
  --t4: #B07CFF;
  --t5: #FFD23F;
  --pixel: "Press Start 2P", "Courier New", monospace;
  --body: "VT323", "Consolas", "Courier New", monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { background: var(--sky); color: var(--ink); }
body {
  font-family: var(--body); font-size: 23px; line-height: 1.2;
  background:
    linear-gradient(180deg, var(--sky-deep) 0 120px, var(--sky) 120px 100%);
  min-height: 100%;
}
button, input, select { font: inherit; color: inherit; }
.sky { position: absolute; inset: 0 0 auto 0; height: 260px; overflow: hidden; pointer-events: none; z-index: 0; }
.cloud { position: absolute; width: 10px; height: 10px; }
/* clouds stay on the right so they never sit behind the white title */
.cloud.c1 { top: 18px; right: calc(4% + 110px); }
.cloud.c2 { top: 150px; right: calc(30% + 110px); transform: scale(.7); transform-origin: 100% 0; }
.cloud.c3 { top: 92px; right: calc(2% + 110px); transform: scale(1.15); transform-origin: 100% 0; }
@media (max-width: 1000px) { .cloud.c1, .cloud.c2 { display: none; } }
.wrap {
  position: relative; z-index: 1;
  max-width: 1200px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 56px;
  display: flex; flex-direction: column; gap: 26px;
}
header.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.brand .logo { width: 40px; height: 40px; image-rendering: pixelated; flex: none; }
.brand h1 { font-family: var(--pixel); font-weight: 400; font-size: clamp(0.95rem, 2.8vw, 1.5rem); margin: 0; line-height: 1.3; color: #fff; text-shadow: 3px 3px 0 var(--ink); letter-spacing: .02em; }
.brand h1 span { color: var(--yellow); }
.brand .eyebrow { color: var(--ink); background: var(--yellow); padding: 6px 8px; border: 3px solid var(--ink); }
.eyebrow { font-family: var(--pixel); font-size: 0.55rem; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }

.btn {
  font-family: var(--pixel); font-size: 0.62rem; text-transform: uppercase; letter-spacing: .02em; line-height: 1.3;
  border: 3px solid var(--ink); background: #fff; color: var(--ink); border-radius: 0;
  padding: 11px 14px; cursor: pointer; box-shadow: 4px 4px 0 var(--ink);
  transition: transform .06s steps(1), box-shadow .06s steps(1);
}
.btn:hover { transform: translate(-1px, -1px); box-shadow: 5px 5px 0 var(--ink); }
.btn:active { transform: translate(4px, 4px); box-shadow: 0 0 0 var(--ink); }
.btn:focus-visible, input:focus-visible, select:focus-visible, .chk:focus-within, .seg button:focus-visible { outline: 3px dashed var(--pink); outline-offset: 4px; }
.btn.primary { background: var(--pink); color: #fff; text-shadow: 2px 2px 0 var(--ink); }
.btn.big { font-size: 0.85rem; padding: 16px 22px; box-shadow: 6px 6px 0 var(--ink); }
.btn.big:active { transform: translate(6px, 6px); }
.btn.ghost { background: var(--paper-2); }
.btn.small { font-size: 0.5rem; padding: 8px 10px; box-shadow: 3px 3px 0 var(--ink); }
.btn.small:active { transform: translate(3px, 3px); }
.btn[disabled] { opacity: .45; cursor: not-allowed; transform: none; }

.panel { background: var(--paper); border: 4px solid var(--ink); border-radius: 0; box-shadow: 6px 6px 0 var(--ink); padding: 20px; min-width: 0; }
.panel h2 { font-family: var(--pixel); font-weight: 400; font-size: 0.85rem; margin: 0 0 10px; line-height: 1.4; text-transform: uppercase; }
.panel .sub { color: var(--muted); margin: 0 0 16px; font-size: 1.05rem; }

/* Setup */
.setup { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr); gap: 24px; }
.setup-hero { grid-column: 1 / -1; display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 28px; align-items: center; padding-block: 8px 4px; }
.setup-hero .eyebrow { color: var(--ink); }
.setup-hero h2 { font-family: var(--pixel); font-weight: 400; font-size: clamp(1.05rem, 2.6vw, 1.9rem); line-height: 1.5; margin: 10px 0 14px; color: #fff; text-shadow: 2px 2px 0 var(--ink); text-wrap: balance; }
.setup-hero p { margin: 0; font-size: 1.35rem; max-width: 46ch; color: var(--ink); background: rgba(255,255,255,.55); padding: 10px 12px; border-left: 6px solid var(--ink); }
.team-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
.team-row { display: flex; gap: 10px; align-items: center; }
.swatch { width: 16px; height: 16px; flex: none; border: 3px solid var(--ink); display: inline-block; }
.field { width: 100%; background: #fff; border: 3px solid var(--ink); border-radius: 0; padding: 6px 10px; min-width: 0; font-family: var(--body); font-size: 1.4rem; color: var(--ink); }
.field::placeholder { color: #9A90B5; }
.icon-btn { background: #fff; border: 3px solid var(--ink); color: var(--ink); width: 40px; height: 40px; cursor: pointer; font-family: var(--pixel); font-size: .8rem; flex: none; box-shadow: 3px 3px 0 var(--ink); }
.icon-btn:active { transform: translate(3px, 3px); box-shadow: none; }
.icon-btn[disabled] { opacity: .4; cursor: not-allowed; }
.cat-group + .cat-group { margin-top: 26px; }
.cat-group h3 { font-family: var(--pixel); font-weight: 400; font-size: 0.65rem; margin: 0 0 4px; line-height: 1.4; color: var(--pink); text-transform: uppercase; }
.cat-group .row-between { margin-bottom: 12px; align-items: flex-end; }
.cat-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.chk { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border: 3px solid var(--ink); cursor: pointer; background: #fff; }
.chk:has(input:checked) { background: var(--paper-2); box-shadow: 3px 3px 0 var(--ink); }
.chk input { margin-top: 4px; accent-color: var(--pink); width: 18px; height: 18px; flex: none; }
.chk strong { display: block; font-size: 1.25rem; line-height: 1.1; font-weight: 400; }
.chk small { color: var(--muted); font-size: 1rem; }
.row-between { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.seg { display: inline-flex; border: 3px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); background: #fff; flex-wrap: wrap; }
.seg button { background: transparent; border: 0; border-right: 3px solid var(--ink); padding: 10px 12px; cursor: pointer; font-family: var(--pixel); font-size: 0.55rem; color: var(--ink); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--yellow); }
.start-bar { grid-column: 1 / -1; display: flex; justify-content: flex-end; align-items: center; gap: 18px; flex-wrap: wrap; }
.start-bar .note { font-size: 1.3rem; background: #fff; border: 3px solid var(--ink); padding: 4px 10px; }

/* Scoring ladder */
.gauge { display: flex; flex-direction: column; gap: 10px; }
.gauge .lvl { display: grid; grid-template-columns: 28px 150px minmax(0,1fr) auto; align-items: center; gap: 10px; }
.gauge .ico { width: 28px; height: 28px; display: block; }
.gauge .ico svg { width: 100%; height: 100%; display: block; }
.gauge .lbl { font-family: var(--pixel); font-size: 0.5rem; line-height: 1.4; text-transform: uppercase; }
.gauge .bar { height: 18px; background: repeating-linear-gradient(90deg, var(--c) 0 12px, transparent 12px 15px); }
.gauge .track { border: 3px solid var(--ink); background: #fff; padding: 2px; }
.gauge .pts { font-family: var(--pixel); font-size: 0.7rem; min-width: 4ch; text-align: right; }
.gauge-cap { color: var(--muted); font-size: 1.05rem; margin-top: 4px; }
.bg-1 { --c: #CFC6E6; } .bg-2 { --c: var(--t2); } .bg-3 { --c: var(--t3); } .bg-4 { --c: var(--t4); } .bg-5 { --c: var(--t5); }

/* Level chips (pixel icon injected per level) */
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 8px 4px 6px; font-family: var(--pixel); font-size: 0.48rem; line-height: 1.3; text-transform: uppercase; border: 2px solid var(--ink); background: #fff; color: var(--ink); white-space: nowrap; box-shadow: 2px 2px 0 var(--ink); }
.chip::before { content: ""; display: none; width: 22px; height: 22px; background-color: var(--ink); background-size: 80% 80%; background-position: center; background-repeat: no-repeat; image-rendering: pixelated; flex: none; margin: -2px 0 -2px -2px; }
.chip.tier-1 { background: var(--t1); } .chip.tier-2 { background: var(--t2); } .chip.tier-3 { background: var(--t3); }
.chip.tier-4 { background: var(--t4); } .chip.tier-5 { background: var(--t5); }
.chip.tier-1::before, .chip.tier-2::before, .chip.tier-3::before, .chip.tier-4::before, .chip.tier-5::before { display: block; }
.chip.miss { background: var(--red); color: #fff; }
.diff { font-family: var(--pixel); font-size: 0.48rem; text-transform: uppercase; color: var(--ink); background: var(--yellow); border: 2px solid var(--ink); padding: 4px 6px; }

/* Stage */
.stage { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 24px; align-items: start; }
.stage.solo { grid-template-columns: minmax(0, 1fr); }
.main-col { display: flex; flex-direction: column; gap: 24px; min-width: 0; }
.prompt-card { padding: 26px; background: #fff; position: relative; }
.prompt-card::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 8px; background: repeating-linear-gradient(90deg, var(--pink) 0 16px, var(--yellow) 16px 32px, var(--green) 32px 48px, var(--blue) 48px 64px, var(--purple) 64px 80px); }
.prompt-meta { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
.prompt-meta .eyebrow { color: var(--pink); }
.panel h2.prompt { font-family: var(--pixel); font-weight: 400; font-size: clamp(0.95rem, 2.2vw, 1.55rem); line-height: 1.6; margin: 0; text-wrap: balance; text-transform: none; }
.prompt-note { color: var(--muted); margin: 14px 0 6px; font-size: 1.3rem; }
.prompt-wrap { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 24px; align-items: center; }
.timer { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.clock { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 12px; background: var(--ink); border: 4px solid var(--ink); box-shadow: 4px 4px 0 rgba(27,16,53,.35); }
.clock .num { font-family: var(--pixel); font-size: 2.2rem; color: var(--yellow); line-height: 1; font-variant-numeric: tabular-nums; min-width: 3ch; text-align: center; }
.segs { display: grid; grid-template-columns: repeat(10, 10px); gap: 3px; }
.segs i { width: 10px; height: 10px; background: #3A2D5C; }
.segs i.on { background: var(--green); }
.clock.low .segs i.on { background: var(--orange); }
.clock.low .num { color: var(--orange); }
.clock.done .num { color: var(--red); animation: blink .5s steps(2) 6; }
.timer .ctrls { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.entry-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
.entry label { display: flex; align-items: center; gap: 8px; font-size: 1.3rem; margin-bottom: 6px; }
.masked { -webkit-text-security: disc; text-security: disc; }
.entry-foot { display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; margin-top: 18px; }

/* Scoreboard */
.scores { background: var(--ink); color: #fff; }
.scores h2 { color: var(--yellow); margin-bottom: 14px; }
.score-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
.score-list li { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 10px; background: #2B1F4D; border: 3px solid #fff; }
.score-list li.lead { background: var(--yellow); color: var(--ink); border-color: var(--yellow); }
.score-list li .swatch { border-color: #fff; }
.score-list li.lead .swatch { border-color: var(--ink); }
.score-list .nm { font-size: 1.3rem; overflow-wrap: anywhere; }
.score-list .sc { font-family: var(--pixel); font-size: 0.8rem; font-variant-numeric: tabular-nums; }
.progress-dots { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 16px; }
.progress-dots i { width: 14px; height: 14px; background: #3A2D5C; }
.progress-dots i.on { background: var(--green); }
.progress-dots i.now { background: var(--yellow); }

/* Reveal */
.reveal-list { display: flex; flex-direction: column; gap: 14px; }
.rv { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 14px 16px; background: #fff; border: 4px solid var(--ink); border-left: 14px solid var(--team, var(--ink)); box-shadow: 5px 5px 0 var(--ink); }
.rv .who { font-family: var(--pixel); font-size: 0.5rem; text-transform: uppercase; color: var(--muted); }
.rv .said { font-size: 2.1rem; line-height: 1.05; overflow-wrap: anywhere; margin-top: 6px; }
.rv .said.blank { color: var(--muted); font-size: 1.5rem; }
.rv .detail { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-top: 8px; font-size: 1.2rem; }
.ref { font-family: var(--body); font-size: 1.15rem; color: var(--ink); background: var(--paper-2); padding: 0 6px; border: 2px solid var(--ink); }
.rv .pts { font-family: var(--pixel); font-size: 1.4rem; text-align: right; line-height: 1; color: var(--pink); text-shadow: 2px 2px 0 var(--ink); }
.rv .pts small { display: block; font-size: 0.45rem; color: var(--muted); margin-top: 8px; text-shadow: none; }
.rv .side { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
.rv .btns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.rv.top { background: repeating-linear-gradient(45deg, #FFF6C8 0 12px, #FFEFA0 12px 24px); }
.lvl-select { background: #fff; border: 3px solid var(--ink); border-radius: 0; padding: 7px 8px; font-family: var(--pixel); font-size: 0.48rem; cursor: pointer; max-width: 100%; box-shadow: 3px 3px 0 var(--ink); color: var(--ink); }
.fix { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
.fix .field { flex: 1 1 220px; font-size: 1.8rem; }
.note-txt { color: var(--muted); }
.why { flex-basis: 100%; color: var(--ink); font-size: 1.25rem; }
.why::before { content: "Why it helps: "; color: var(--pink); }
.why.matters::before { content: "Why it matters: "; }
.anim .rv { animation: pop .45s steps(5) both; animation-delay: calc(var(--i) * 450ms); }
.missed { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
.missed .m { padding: 10px; border: 3px solid var(--ink); background: #fff; display: flex; flex-direction: column; gap: 6px; }
.missed .m b { font-size: 1.35rem; font-weight: 400; }
.full-list { margin-top: 16px; display: flex; flex-direction: column; gap: 14px; }
.full-list .grp { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 1.2rem; }
.full-list .grp b { color: var(--pink); }
.nav-foot { display: flex; justify-content: flex-end; gap: 12px; flex-wrap: wrap; }

/* The climb */
.climb-wrap { display: flex; flex-direction: column; gap: 20px; }
.climb-panel { display: flex; flex-direction: column; gap: 14px; }
#climb { display: block; width: min(100%, calc(70vh * 1.6)); height: auto; aspect-ratio: 16 / 10; margin: 0 auto; image-rendering: pixelated; image-rendering: crisp-edges; border: 4px solid var(--ink); background: #0B0620; }
.climb-key { margin: 0; text-align: center; font-size: 1.15rem; color: var(--muted); }

/* Final */
.final { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 24px; }
.final h2.win { font-family: var(--pixel); font-weight: 400; font-size: clamp(1rem, 2.4vw, 1.5rem); line-height: 1.5; margin: 10px 0 18px; color: var(--pink); text-shadow: 3px 3px 0 var(--ink); }
.podium { display: flex; flex-direction: column; gap: 10px; }
.pod { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 12px 14px; background: #fff; border: 4px solid var(--ink); border-left: 14px solid var(--team); }
.pod .rank { font-family: var(--pixel); font-size: 1.3rem; color: var(--muted); }
.pod.first { background: var(--yellow); box-shadow: 5px 5px 0 var(--ink); }
.pod.first .rank { color: var(--ink); }
.pod .nm { font-size: 1.8rem; overflow-wrap: anywhere; }
.pod .sc { font-family: var(--pixel); font-size: 1.1rem; }
.best { display: flex; flex-direction: column; gap: 12px; }
.best .big { font-family: var(--pixel); font-size: clamp(1rem, 2.2vw, 1.4rem); line-height: 1.5; color: var(--ink); background: var(--yellow); border: 3px solid var(--ink); padding: 10px 12px; overflow-wrap: anywhere; }

/* Answer key */
dialog { background: var(--paper); color: var(--ink); border: 4px solid var(--ink); border-radius: 0; box-shadow: 8px 8px 0 var(--ink); padding: 0; width: min(900px, calc(100vw - 32px)); max-height: calc(100vh - 48px); }
dialog::backdrop { background: rgba(27, 16, 53, .6); }
.dlg-head { position: sticky; top: 0; background: var(--ink); color: #fff; padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; gap: 12px; z-index: 1; }
.dlg-head h2 { font-family: var(--pixel); font-weight: 400; margin: 0; font-size: 0.9rem; color: var(--yellow); }
.dlg-body { padding: 8px 20px 24px; }
.key-section { font-family: var(--pixel); font-weight: 400; font-size: 0.7rem; margin: 24px 0 6px; color: var(--pink); text-transform: uppercase; }
details.key { border-bottom: 3px dashed var(--ink); padding: 12px 0; }
details.key summary { cursor: pointer; font-size: 1.4rem; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.key-tier { margin: 14px 0 6px; }
.key-items { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px 16px; }
.key-items div { font-size: 1.2rem; }
.key-items .alt { display: block; color: var(--muted); font-size: 1rem; }
.key-miss { margin-top: 12px; font-size: 1.1rem; color: var(--muted); }
.key-miss b { color: var(--ink); font-weight: 400; }

/* Phones */
.live { margin: 0 0 24px; padding: 0 0 22px; border-bottom: 3px dashed var(--ink); display: flex; flex-direction: column; gap: 12px; }
.live-on { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 16px; align-items: center; }
.qr { display: block; width: 100%; aspect-ratio: 1; image-rendering: pixelated; border: 4px solid var(--ink); background: #fff; }
.join-code { font-family: var(--pixel); font-size: 1.4rem; letter-spacing: .15em; color: var(--pink); text-shadow: 2px 2px 0 var(--ink); }
.join-url { font-size: 1.15rem; overflow-wrap: anywhere; }
.live-stat { font-size: 1.1rem; display: flex; align-items: center; gap: 8px; }
.dot { width: 12px; height: 12px; border: 2px solid var(--ink); background: #CFC6E6; flex: none; }
.dot.on { background: var(--green); }
.dot.warn { background: var(--orange); }
.phone { font-family: var(--pixel); font-size: 0.42rem; text-transform: uppercase; border: 2px solid var(--ink); background: #fff; padding: 4px 5px; display: inline-flex; gap: 5px; align-items: center; flex: none; white-space: nowrap; }
.phone .dot { width: 8px; height: 8px; border-width: 1px; }
.phone.got { background: var(--green); }
.entry label .phone { margin-left: auto; }
.live-warn { font-size: 1.1rem; background: var(--yellow); border: 3px solid var(--ink); padding: 6px 10px; }
.join-dlg { width: min(760px, calc(100vw - 32px)); }
.join-big { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 28px; align-items: center; padding-top: 16px; }
.join-big .qr { max-width: 340px; margin: 0 auto; }
.join-big .join-code { font-size: clamp(1.6rem, 5vw, 2.6rem); }
.join-big ol { margin: 0; padding-left: 1.2em; font-size: 1.4rem; display: flex; flex-direction: column; gap: 8px; }
@media (max-width: 560px) { .live-on, .join-big { grid-template-columns: minmax(0, 1fr); } .live-on .qr { max-width: 200px; } }

@keyframes pop { 0% { opacity: 0; transform: translateY(16px) scale(.9); } 100% { opacity: 1; transform: none; } }
@keyframes blink { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  .anim .rv, .clock.done .num { animation: none; }
}

const STRIP = new Set(["the","a","an","king","queen","prophet","prophetess","judge","book","of","1","2","3","first","second","i","ii","1st","2nd","saint","st"]);
function norm(s) {
  return String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "")
    .replace(/['’‘`]/g, "").replace(/[^a-z0-9]+/g, " ").trim();
}
function stripLead(s) {
  const w = s.split(" ");
  while (w.length > 1 && STRIP.has(w[0])) w.shift();
  return w.join(" ");
}
function lev(a, b) {
  if (a === b) return 0;
  const m = a.length, n = b.length;
  if (Math.abs(m - n) > 3) return 99;
  let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) {
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    }
    prev = cur;
  }
  return prev[n];
}
function thr(s) { if (/\d/.test(s)) return 0; /* chapter and verse numbers must match exactly */ const L = s.replace(/ /g, "").length; return L <= 2 ? 0 : L <= 4 ? 1 : L <= 8 ? 2 : 3; }

/* Every way to cite a reference: "Isaiah 29:11–12" also accepts "isaiah 29 11" and "isaiah 29 12". */
function refKeys(r) {
  const out = []; let book = "";
  String(r).split(";").forEach(part => {
    const m = part.trim().match(/^((?:\d\s)?[A-Za-z][A-Za-z .—-]*?)?\s*(\d+)(?::(\d+)(?:[–-](\d+))?)?/);
    if (!m) return;
    if (m[1]) book = norm(m[1]);
    if (!book) return;
    if (!m[3]) { out.push(`${book} ${m[2]}`); return; }
    const a = +m[3], b = m[4] ? +m[4] : a;
    for (let v = a; v <= Math.min(b, a + 30); v++) out.push(`${book} ${m[2]} ${v}`);
    out.push(`${book} ${m[2]} ${a}${m[4] ? " " + b : ""}`);
  });
  return out;
}

    const keys = keysOf(d.replace(/\s*\(.*\)$/, ""), al);
    if (c.refs && /\d/.test(r || "")) keys.push(norm(r), ...refKeys(r));
    return { d, t: +t, r: ref, al: al || "", why: why || "", keys, miss: false };

function matchAnswer(cat, input) {

/* Timer */
let audioCtx = null;
function beep(freq, dur) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain(), t0 = audioCtx.currentTime;
    o.type = "square"; o.frequency.value = freq; o.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.12, t0 + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.start(t0); o.stop(t0 + dur + 0.05);
  } catch (e) {}
}
function resetTimer() { T.left = S.timer; T.running = false; T.done = false; clearInterval(T.iv); T.iv = null; }
function stopTimer() { T.running = false; clearInterval(T.iv); T.iv = null; }
function toggleTimer() {
  if (T.running) { stopTimer(); }
  else {
    if (T.left <= 0) { T.left = S.timer; T.done = false; }
    beep(520, 0.15);
    T.running = true;
    T.iv = setInterval(() => {
      T.left = Math.max(0, T.left - 1);
      if (T.left > 0 && T.left <= 5) beep(700, 0.12);
      if (T.left === 0) { stopTimer(); T.done = true; beep(440, 0.9); LIVE.publish(); }
      paintTimer();
    }, 1000);
  }
  paintTimer();
  LIVE.publish();
}
function paintTimer() {
  const ring = document.getElementById("ring");
  if (!ring) return;
  const total = Math.max(S.timer, T.left);
  document.getElementById("ring-num").textContent = T.left;
  const lit = Math.ceil((T.left / total) * 20);
  [...document.getElementById("segs").children].forEach((seg, i) => seg.classList.toggle("on", i < lit));
  ring.classList.toggle("low", T.left <= 10);
  ring.classList.toggle("done", T.done);
  const go = document.getElementById("t-go");
  if (go) go.textContent = T.running ? "Pause" : T.done ? "Restart" : T.left < S.timer ? "Resume" : "Start timer";
}

function doReveal() {
  stopTimer();
  const cat = CAT[S.order[S.round]];
  const entries = S.teams.map((_, i) => makeEntry(cat, S.drafts[i] || ""));
  S.history[S.round] = { cat: cat.id, entries };
  S.phase = "reveal";
  anim = true;
  editing = null;
  render();
  window.scrollTo({ top: 0 });
}

function makeEntry(cat, raw, orig) {
  const text = String(raw).trim();
  const m = text ? matchAnswer(cat, text) : null;
  const base = { text, orig: orig === undefined ? text : orig, override: null };
  return m ? { ...base, d: m.d, t: m.t || 0, r: m.r, miss: m.miss, note: m.note || "", why: m.why || "" }
           : { ...base, d: null, t: 0, r: "", miss: false, note: "" };
}

let showRare = false; /* rare-answers panel on the reveal screen, hidden until the leader asks */

function renderReveal() {

  const rare = cat.a.filter(a => !given.has(a.d) && a.t >= 3).sort((a, b) => b.t - a.t).slice(0, 8);
  app.innerHTML = `<section class="stage solo">
    <div class="main-col">
      <div class="panel prompt-card" style="padding:22px 28px">
        <div class="prompt-meta"><span class="eyebrow">Round ${S.round + 1} of ${S.order.length} · Reveal</span></div>
        <h2 class="prompt" style="font-size:clamp(0.85rem,1.8vw,1.2rem)">${esc(cat.prompt)}</h2>
      </div>
      <div class="reveal-list ${anim ? "anim" : ""}">${rows}</div>
      <div class="panel" id="rare-panel" ${showRare ? "" : "hidden"}>
        <h2>Rare answers nobody said</h2>
        ${rare.length
          ? `<p class="sub">The highest-scoring answers still on the table.</p>
             <div class="missed">${rare.map(a => `<div class="m"><span class="chip tier-${a.t}" style="align-self:flex-start">${TIERS[a.t].name}</span><b>${esc(a.d)}</b><span class="ref">${esc(a.r)}</span>${a.why ? `<span class="note-txt" style="font-size:1rem">${esc(a.why)}</span>` : ""}</div>`).join("")}</div>`
          : `<p class="sub" style="margin:0">Every rare answer was taken. Impressive.</p>`}
      </div>
      <div class="nav-foot" style="justify-content:space-between">
        <button class="btn" type="button" id="rare-toggle" aria-expanded="${showRare}" aria-controls="rare-panel">${showRare ? "Hide rare answers" : "Show rare answers"}</button>
        <button class="btn primary big" type="button" id="next">See the Ascent</button>
      </div>
    </div>
  </section>`;
  anim = false;

  app.querySelectorAll("[data-ovr]").forEach(b => b.addEventListener("click", () => {
    r.entries[+b.dataset.ovr].override = b.dataset.val || null;
    render();
  }));
  app.querySelectorAll("[data-level]").forEach(sel => sel.addEventListener("change", () => {
    const e = r.entries[+sel.dataset.level];
    if (sel.value) { e.override = "yes"; e.ot = +sel.value; }
    else { e.override = null; delete e.ot; }
    render();
  }));
  app.querySelectorAll("[data-edit]").forEach(b => b.addEventListener("click", () => {
    editing = +b.dataset.edit;
    render();
    const inp = document.getElementById(`fix-${editing}`);
    if (inp) { inp.focus(); inp.select(); }
  }));
  app.querySelectorAll("[data-fix]").forEach(f => {
    f.addEventListener("submit", ev => {
      ev.preventDefault();
      const i = +f.dataset.fix;
      const old = r.entries[i];
      r.entries[i] = makeEntry(cat, document.getElementById(`fix-${i}`).value, old.orig || "");
      editing = null;
      render();
    });
    f.querySelector("[data-cancel]").addEventListener("click", () => { editing = null; render(); });
    f.querySelector("input").addEventListener("keydown", ev => { if (ev.key === "Escape") { editing = null; render(); } });
  });
  document.getElementById("rare-toggle").addEventListener("click", e => {
    showRare = !showRare;
    const panel = document.getElementById("rare-panel");
    panel.hidden = !showRare;
    e.currentTarget.setAttribute("aria-expanded", String(showRare));
    e.currentTarget.textContent = showRare ? "Hide rare answers" : "Show rare answers";
    if (showRare) panel.scrollIntoView({ behavior: "smooth", block: "nearest" });
  });
  document.getElementById("next").addEventListener("click", () => {
    showRare = false;
    S.phase = "climb";
    render();
    window.scrollTo({ top: 0 });
  });
}

/* ---------- The climb: team stars rise from the plain toward the Sun ---------- */
const CL = { W: 320, H: 200, GROUND: 22, PEAK: 180, SPACE: 600, STARS: 820, MOON: 1150, SUN: 1760, TOP: 1880 };
const MILESTONES = [[CL.PEAK, "the mountaintop"], [CL.SPACE, "outer space"], [CL.STARS, "the stars"], [CL.MOON, "the Moon"], [CL.SUN, "the Sun"]];
const SKY_STOPS = [[0, "#8FE0FF"], [260, "#4FC3F7"], [440, "#2F7BE0"], [610, "#1D2A78"], [820, "#0B0620"]];
let climbRaf = null;
function stopClimb() { if (climbRaf) cancelAnimationFrame(climbRaf); climbRaf = null; }
function sunPoints() { return Math.max(250, Math.round(S.order.length * 100 * 0.5)); }
function altFor(p) { return Math.min(CL.TOP - 30, CL.GROUND + (p / sunPoints()) * (CL.SUN - CL.GROUND)); }
function ptsAt(alt) { return Math.round(((alt - CL.GROUND) / (CL.SUN - CL.GROUND)) * sunPoints()); }
function totalsBefore(n) {
  const t = S.teams.map(() => 0);
  S.history.slice(0, n).forEach(r => { if (r) roundPoints(r).forEach((p, i) => { if (i < t.length) t[i] += p; }); });
  return t;
}
const rgbOf = h => { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
const skyCache = new Map();
function skyAt(y) {
  const band = Math.floor(y / 14) * 14;
  if (skyCache.has(band)) return skyCache.get(band);
  let col = SKY_STOPS[SKY_STOPS.length - 1][1];
  for (let i = 0; i < SKY_STOPS.length - 1; i++) {
    const [y0, c0] = SKY_STOPS[i], [y1, c1] = SKY_STOPS[i + 1];
    if (band <= y1) {
      const f = Math.max(0, (band - y0) / (y1 - y0)), a = rgbOf(c0), b = rgbOf(c1);
      col = `rgb(${a.map((v, j) => Math.round(v + (b[j] - v) * f)).join(",")})`;
      break;
    }
  }
  skyCache.set(band, col);
  return col;
}
const STARFIELD = (() => {
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const out = [];
  for (let i = 0; i < 420; i++) {
    const y = 460 + Math.pow(rnd(), 0.7) * (CL.TOP + 60 - 460);
    out.push({ x: Math.floor(rnd() * CL.W), y, big: rnd() > 0.88, ph: rnd() * 6.28 });
  }
  return out;
})();
const CLOUDS = [[34, 250], [196, 318], [96, 392], [252, 468]];
const STAR_SPRITE = PIX[5];

function drawClimb(ctx, cam, now, stars, banner) {
  const H = CL.H, W = CL.W;
  const sy = y => Math.round(H - (y - cam));
  /* sky, in stepped bands */
  for (let s = 0; s < H; s += 2) { ctx.fillStyle = skyAt(cam + (H - s)); ctx.fillRect(0, s, W, 2); }
  /* starfield */
  STARFIELD.forEach(st => {
    const s = sy(st.y); if (s < -2 || s > H) return;
    const tw = Math.sin(now / 400 + st.ph) > 0.6;
    ctx.fillStyle = tw ? "#FFD23F" : "#FFFFFF";
    const z = st.big ? 2 : 1;
    ctx.fillRect(st.x, s, z, z);
  });
  /* clouds */
  const rows = [[3, 5], [2, 7], [1, 9], [0, 10]];
  CLOUDS.forEach(([cx, cy]) => {
    const top = sy(cy); if (top < -20 || top > H + 4) return;
    ctx.fillStyle = "#FFFFFF";
    rows.forEach(([a, b], r) => ctx.fillRect(cx + a * 3, top + r * 3, (b - a + 1) * 3, 3));
  });
  /* moon */
  const disc = (cx, cy, r, fill) => {
    for (let dy = -r; dy <= r; dy += 2) {
      const w = Math.round(Math.sqrt(r * r - dy * dy) / 2) * 2;
      const s = sy(cy + dy); if (s < -2 || s > H + 2) continue;
      ctx.fillStyle = fill; ctx.fillRect(cx - w, s, w * 2, 2);
    }
  };
  if (Math.abs(CL.MOON - (cam + H / 2)) < H) {
    disc(252, CL.MOON, 26, "#F1EBD0");
    disc(244, CL.MOON + 8, 6, "#CFC6A8"); disc(262, CL.MOON - 6, 4, "#CFC6A8"); disc(252, CL.MOON - 14, 3, "#CFC6A8");
  }
  /* sun */
  if (Math.abs(CL.SUN - (cam + H / 2)) < H + 40) {
    const pulse = Math.sin(now / 300) > 0 ? 2 : 0;
    ctx.fillStyle = "#FF8A3D";
    for (let k = 0; k < 8; k++) {
      const ang = k * Math.PI / 4, r1 = 46, r2 = 60 + pulse;
      for (let r = r1; r < r2; r += 2) {
        const x = Math.round(160 + Math.cos(ang) * r), s = sy(CL.SUN + Math.sin(ang) * r);
        ctx.fillRect(x - 2, s - 2, 4, 4);
      }
    }
    disc(160, CL.SUN, 42, "#FF8A3D");
    disc(160, CL.SUN, 36, "#FFD23F");
    disc(156, CL.SUN + 6, 20, "#FFF3A0");
  }
  /* small green hill and the big mountain */
  const mount = (px, peak, half, light, dark, snowLine) => {
    for (let y = CL.GROUND; y <= peak; y += 2) {
      const s = sy(y); if (s < -2 || s > H + 2) continue;
      const w = Math.round(((peak - y) / (peak - CL.GROUND)) * half / 2) * 2;
      const snow = snowLine && y > peak - snowLine + ((y / 2) % 3 === 0 ? 4 : 0);
      ctx.fillStyle = snow ? "#FFFFFF" : light; ctx.fillRect(px - w, s - 2, w, 2);
      ctx.fillStyle = snow ? "#D9D4E8" : dark; ctx.fillRect(px, s - 2, w, 2);
    }
  };
  mount(66, 74, 150, "#3FBF2A", "#2E9E1F", 0);
  mount(238, CL.PEAK, 250, "#9C8CC0", "#6E5E99", 38);
  /* grassy plain */
  for (let y = 0; y < CL.GROUND; y += 2) {
    const s = sy(y + 2); if (s < -2 || s > H + 2) continue;
    ctx.fillStyle = y >= CL.GROUND - 6 ? "#5FD43A" : y >= CL.GROUND - 12 ? "#2E9E1F" : "#8B5A2B";
    ctx.fillRect(0, s, W, 2);
  }
  const grassTop = sy(CL.GROUND);
  if (grassTop > -4 && grassTop < H + 4) {
    ctx.fillStyle = "#2E9E1F";
    for (let x = 2; x < W; x += 7) ctx.fillRect(x, grassTop - 2, 2, 2);
  }
  /* team stars */
  ctx.textAlign = "center"; ctx.textBaseline = "alphabetic"; ctx.lineJoin = "round";
  ctx.font = '8px "Press Start 2P", monospace';
  stars.forEach(st => {
    const bottom = sy(st.alt);
    if (bottom > H + 4 || bottom < 14) {
      /* outside the view: arrow and score at that edge */
      const down = bottom > H + 4, score = String(Math.round(st.shown));
      const bw = ctx.measureText(score).width + 16, bx = Math.round(st.x - bw / 2), by = down ? H - 13 : 1;
      ctx.fillStyle = "#1B1035"; ctx.fillRect(bx, by, bw, 12);
      ctx.fillStyle = st.color;
      if (down) { ctx.fillRect(bx + 2, by + 3, 6, 2); ctx.fillRect(bx + 3, by + 5, 4, 2); ctx.fillRect(bx + 4, by + 7, 2, 2); }
      else { ctx.fillRect(bx + 4, by + 3, 2, 2); ctx.fillRect(bx + 3, by + 5, 4, 2); ctx.fillRect(bx + 2, by + 7, 6, 2); }
      ctx.textAlign = "left"; ctx.fillText(score, bx + 11, by + 10); ctx.textAlign = "center";
      return;
    }
    const sc = 2, w = 10 * sc, h = 8 * sc, x0 = Math.round(st.x - w / 2), y0 = bottom - h;
    /* sparkle trail while rising */
    if (st.moving) {
      for (let k = 1; k <= 6; k++) {
        if ((Math.floor(now / 60) + k) % 2) continue;
        ctx.fillStyle = k < 3 ? "#FFFFFF" : st.color;
        ctx.fillRect(st.x - 3 + ((k * 3) % 5), bottom + k * 5, 2, 2);
      }
    }
    const paint = (dx, dy, col) => STAR_SPRITE.forEach((row, ry) => [...row].forEach((ch, rx) => {
      if (ch === ".") return;
      ctx.fillStyle = col || (ch === "o" ? "#FFFFFF" : st.color);
      ctx.fillRect(x0 + rx * sc + dx, y0 + ry * sc + dy, sc, sc);
    }));
    [[-2, 0], [2, 0], [0, -2], [0, 2]].forEach(([dx, dy]) => paint(dx, dy, "#1B1035"));
    paint(0, 0);
    ctx.lineWidth = 3; ctx.strokeStyle = "#1B1035";
    ctx.strokeText(st.label, st.x, y0 - 5); ctx.fillStyle = "#FFFFFF"; ctx.fillText(st.label, st.x, y0 - 5);
    const score = String(Math.round(st.shown));
    ctx.strokeText(score, st.x, bottom + 11); ctx.fillStyle = "#FFD23F"; ctx.fillText(score, st.x, bottom + 11);
  });
  /* altitude ruler on the right: the whole trip, with every team on it */
  const RX = W - 11, RT = 8, RB = H - 8, RH = RB - RT;
  const ry = alt => Math.round(RB - (Math.min(alt, CL.TOP) / CL.TOP) * RH);
  ctx.fillStyle = "#1B1035"; ctx.fillRect(RX - 2, RT - 2, 9, RH + 4);
  for (let s = RT; s < RB; s += 2) {
    const alt = ((RB - s) / RH) * CL.TOP;
    ctx.fillStyle = alt < CL.GROUND + 8 ? "#5FD43A" : skyAt(alt); ctx.fillRect(RX, s, 5, 2);
  }
  ctx.fillStyle = "#9C8CC0"; ctx.fillRect(RX + 1, ry(CL.PEAK), 3, ry(CL.GROUND) - ry(CL.PEAK));
  ctx.fillStyle = "#F1EBD0"; ctx.fillRect(RX + 1, ry(CL.MOON) - 1, 3, 3);
  ctx.fillStyle = "#FFD23F"; ctx.fillRect(RX, ry(CL.SUN) - 2, 5, 5);
  /* the part of the trip on screen */
  ctx.strokeStyle = "#FFFFFF"; ctx.lineWidth = 1;
  ctx.strokeRect(RX - 1.5, ry(cam + H) - 0.5, 8, Math.max(2, ry(cam) - ry(cam + H)));
  stars.forEach(st => {
    const y = ry(st.alt);
    ctx.fillStyle = "#1B1035"; ctx.fillRect(RX - 9, y - 2, 7, 5);
    ctx.fillStyle = st.color; ctx.fillRect(RX - 8, y - 1, 5, 3);
  });

  /* milestone banner */
  if (banner) {
    const tw = ctx.measureText(banner).width + 16;
    ctx.fillStyle = "#1B1035"; ctx.fillRect((W - tw) / 2, 6, tw, 18);
    ctx.fillStyle = "#FFD23F"; ctx.fillRect((W - tw) / 2, 22, tw, 2);
    ctx.fillStyle = "#FFFFFF"; ctx.fillText(banner, W / 2, 19);
  }
}

function startClimb(canvas) {
  stopClimb();
  const ctx = canvas.getContext("2d");
  ctx.imageSmoothingEnabled = false;
  const before = totalsBefore(S.round), after = totals();
  const n = S.teams.length;
  const spacing = n > 1 ? (CL.W - 84) / (n - 1) : 0; /* leave room for the altitude ruler */
  const maxChars = Math.max(3, Math.floor((n > 1 ? spacing : 200) / 8) - 1);
  const stars = S.teams.map((_, i) => {
    const name = teamName(i);
    return { x: Math.round(n > 1 ? 32 + i * spacing : (CL.W - 20) / 2), color: TEAM_COLORS[i], label: name.length > maxChars ? name.slice(0, maxChars - 1) + "." : name,
      from: before[i], to: after[i], alt: altFor(before[i]), shown: before[i], moving: false };
  });
  const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const HOLD = 700, RISE = 3200;
  const announced = new Set();
  const queue = []; let banner = null, bannerUntil = 0;
  const clampCam = c => Math.max(0, Math.min(CL.TOP - CL.H, c));
  /* follow the leader, and keep everyone in view when they fit */
  const leaderCam = () => {
    const hi = Math.max(...stars.map(s => s.alt)), lo = Math.min(...stars.map(s => s.alt));
    let c = hi - CL.H * 0.62;
    if (lo - c < 24) c = Math.max(lo - 24, hi - CL.H * 0.82);
    return clampCam(c);
  };
  const lowCam = () => clampCam(Math.min(...stars.map(s => s.alt)) - 30);
  let doneAt = null;
  const PAN = 2600;
  const camTarget = now => {
    const lead = leaderCam(), low = lowCam();
    if (doneAt === null || lead - low < 20) return lead;
    /* after the rise: pan down to the lowest team, pause, and come back up */
    const t = now - doneAt - 900;
    if (t < 0) return lead;
    if (t < PAN) return lead + (low - lead) * ease(t / PAN);
    if (t < PAN + 1200) return low;
    if (t < PAN * 2 + 1200) return low + (lead - low) * ease((t - PAN - 1200) / PAN);
    return lead;
  };
  let cam = leaderCam();
  const t0 = performance.now();
  let played = false;
  const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const frame = now => {
    const p = reduce ? 1 : Math.max(0, Math.min(1, (now - t0 - HOLD) / RISE));
    if (!played && p > 0 && after.some((v, i) => v > before[i])) {
      played = true;
      [523, 659, 784, 1047].forEach((f, k) => setTimeout(() => beep(f, 0.12), k * 110));
    }
    stars.forEach((st, i) => {
      const prevAlt = st.alt;
      const pts = st.from + (st.to - st.from) * ease(p);
      st.alt = altFor(pts); st.shown = pts; st.moving = p > 0 && p < 1 && st.to > st.from;
      MILESTONES.forEach(([m, label]) => {
        const key = i + "@" + m;
        if (!announced.has(key) && altFor(st.from) < m && st.alt >= m && prevAlt <= st.alt) {
          announced.add(key); queue.push(`${teamName(i).slice(0, 12)} reached ${label}!`);
        }
      });
    });
    if (now > bannerUntil) { banner = queue.shift() || null; if (banner) { bannerUntil = now + 1500; beep(880, 0.08); } }
    if (p >= 1 && doneAt === null) doneAt = now;
    cam += (camTarget(now) - cam) * (reduce ? 1 : doneAt !== null ? 0.2 : 0.08);
    drawClimb(ctx, cam, now, stars, banner);
    climbRaf = requestAnimationFrame(frame);
  };
  const go = () => { climbRaf = requestAnimationFrame(frame); };
  if (document.fonts && document.fonts.load) document.fonts.load('8px "Press Start 2P"').then(go, go); else go();
}

function renderClimb() {
  const last = S.round >= S.order.length - 1;
  const t = totals();
  const sp = sunPoints();
  app.innerHTML = `<section class="climb-wrap">
    <div class="panel climb-panel">
      <div class="row-between">
        <div><span class="eyebrow">After round ${S.round + 1} of ${S.order.length}</span><h2 style="margin:8px 0 0">The Ascent</h2></div>
        <button class="btn small ghost" type="button" id="replay">Replay</button>
      </div>
      <canvas id="climb" width="${CL.W}" height="${CL.H}" role="img"
        aria-label="Standings: ${esc(S.teams.map((_, i) => `${teamName(i)} ${t[i]} points`).join(", "))}"></canvas>    </div>
    <div class="nav-foot"><button class="btn primary big" type="button" id="cont">${last ? "See final scores" : "Next round"}</button></div>
  </section>`;
  const canvas = document.getElementById("climb");
  startClimb(canvas);
  document.getElementById("replay").addEventListener("click", () => startClimb(canvas));
  document.getElementById("cont").addEventListener("click", () => {
    stopClimb();
    S.drafts = {};
    if (last) S.phase = "final";
    else { S.round++; S.phase = "round"; resetTimer(); }
    render();
    window.scrollTo({ top: 0 });
  });
}

function renderFinal() {
  const t = totals();
  const ranked = S.teams.map((_, i) => i).sort((a, b) => t[b] - t[a]);
  let best = null;
  S.history.forEach(r => { if (!r) return; r.entries.forEach((e, i) => {
    const lvl = e.override === "no" ? 0 : (e.d && !e.miss) ? e.t : e.override === "yes" ? (e.ot || 1) : 0;
    if (lvl && (!best || lvl > best.e.t)) best = { e: { d: e.d && !e.miss ? e.d : e.text, t: lvl, r: e.d && !e.miss ? e.r : "Counted by the leader" }, i, cat: CAT[r.cat] };
  }); });
  let rank = 0, prev = null;
  app.innerHTML = `<section class="final">
    <div class="panel">
      <span class="eyebrow">Final scores</span>
      <h2 class="win">${t[ranked[0]] > 0 ? esc(teamName(ranked[0])) + " wins" : "Game over"}</h2>
      <div class="podium">
        ${ranked.map((i, pos) => { if (t[i] !== prev) { rank = pos + 1; prev = t[i]; } return `<div class="pod ${rank === 1 ? "first" : ""}" style="--team:${TEAM_COLORS[i]}"><span class="rank">${rank}</span><span class="nm">${esc(teamName(i))}</span><span class="sc">${t[i]}</span></div>`; }).join("")}
      </div>
    </div>
    <div class="panel best">
      <span class="eyebrow">Rarest answer of the game</span>
      ${best ? `<div class="big">${esc(best.e.d)}</div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><span class="chip tier-${best.e.t}">${TIERS[best.e.t].name}</span><span class="ref">${esc(best.e.r)}</span></div>
        <p class="note-txt" style="margin:0">${esc(teamName(best.i))}, for “${esc(best.cat.prompt)}”</p>` : `<p class="note-txt">No valid answers this game.</p>`}
      <p class="note-txt" style="margin:8px 0 0">${S.history.filter(Boolean).length} rounds played.</p>
      <div class="actions" style="margin-top:12px">
        <button class="btn primary" type="button" id="again">Play again with these teams</button>
        <button class="btn" type="button" id="setup">Change setup</button>
      </div>
    </div>
  </section>`;
  document.getElementById("again").addEventListener("click", () => { if (!S.picked.length) S.picked = STUDY_IDS.slice(); startGame(); });
  document.getElementById("setup").addEventListener("click", () => { const k = { teams: S.teams, links: S.links, timer: S.timer, picked: S.picked }; S = Object.assign(fresh(), k); render(); });
}

/* End game (two-step, since confirm() is unavailable) */
endBtn.addEventListener("click", () => {
  if (endBtn.dataset.armed) {
    stopTimer();
    S.history = S.history.filter(Boolean);
    S.phase = S.history.length ? "final" : "setup";
    render();
    return;
  }
  endBtn.dataset.armed = "1"; endBtn.textContent = "Click again to end";
  setTimeout(() => { if (endBtn.dataset.armed) { endBtn.dataset.armed = ""; endBtn.textContent = "End game"; } }, 3000);
});

/* Answer key */

document.getElementById("btn-key").addEventListener("click", () => {

    ${[1, 2, 3, 4, 5].map(t => { const items = c.a.filter(a => a.t === t); return items.length ? `<div class="key-tier"><span class="chip tier-${t}">${TIERS[t].name} · ${TIERS[t].pts}</span></div>
      <div class="key-items">${items.map(a => `<div>${esc(a.d)} <span class="ref">${esc(a.r)}</span>${a.why ? `<span class="alt" style="color:var(--ink)">${esc(a.why)}</span>` : ""}${a.al ? `<span class="alt">Also accepts: ${esc(a.al.split(";").join(", "))}</span>` : ""}</div>`).join("")}</div>` : ""; }).join("")}
    ${c.n.length ? `<div class="key-miss"><b>Close but not counted:</b> ${c.n.map(m => `${esc(m.d)} (${esc(m.note)})`).join(" · ")}</div>` : ""}

  dlg.showModal();
});
document.getElementById("key-close").addEventListener("click", () => dlg.close());
dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });

/* ---------- Phones ----------
   Optional. The leader opens a room (POST /api/rooms), shows its QR code, and each team's
   representative joins at /join/ on a phone. This screen stays in charge of the game: it gives each
   phone a team, and tells phones what to show through "view" messages. Phone answers go straight
   into the team's answer box, where the leader can still change them before revealing.
   Needs the site's server (worker/index.ts); opened as a plain file the game still works without it. */
const LIVE = (() => {
  const LKEY = "one-in-a-millennium-live";
  let room = null;           /* { code, key } */
  try { room = JSON.parse(localStorage.getItem(LKEY)); } catch (e) {}
  if (!room || !room.code || !room.key) room = null;
  let ws = null, status = "off", retry = 0, retryT = null, pingT = null, soonT = null, error = "";
  const players = {};        /* pid -> { name, online } */
  const answers = {};        /* pid -> { round, text } */
  const saveRoom = () => { try { room ? localStorage.setItem(LKEY, JSON.stringify(room)) : localStorage.removeItem(LKEY); } catch (e) {} };
  const send = m => { if (ws && ws.readyState === 1) { ws.send(JSON.stringify(m)); return true; } return false; };
  const joinURL = () => room ? `${location.origin}/join/?code=${room.code}` : "";
  const qrSrc = () => `/api/qr?text=${encodeURIComponent(joinURL())}`;
  const localOnly = () => /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
  const roundKey = () => `${S.gameId || "g"}:${S.round}:${S.order[S.round] || ""}`;
  const teamOf = pid => pid ? S.links.indexOf(pid) : -1;
  const isDefaultName = i => /^team \d+$/i.test((S.teams[i] || "").trim()) || !(S.teams[i] || "").trim();

  async function openRoom() {
    error = ""; status = "connecting"; refreshUI();
    try {
      const r = await fetch("/api/rooms", { method: "POST" });
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const j = await r.json();
      room = { code: j.code, key: j.hostKey }; saveRoom();
      connect();
    } catch (e) {
      status = "off";
      error = location.protocol === "file:"
        ? "Phone joining needs the game opened from the website, not as a file."
        : "Couldn't reach the game server. Check the internet connection and try again.";
      refreshUI();
    }
  }
  function closeRoom() {
    send({ t: "close" });
    clearTimeout(retryT); clearInterval(pingT);
    if (ws) { ws.onclose = null; ws.close(); }
    ws = null; room = null; status = "off"; saveRoom();
    S.links = S.teams.map(() => null);
    for (const k in players) delete players[k];
    for (const k in answers) delete answers[k];
    render();
  }
  function connect() {
    if (!room) return;
    clearTimeout(retryT);
    status = retry ? "reconnecting" : "connecting";
    const url = `${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/api/rooms/${room.code}/ws?role=host&key=${encodeURIComponent(room.key)}`;
    try { ws = new WebSocket(url); } catch (e) { return scheduleRetry(); }
    let opened = false;
    ws.onopen = () => {
      opened = true; retry = 0; status = "on"; error = "";
      clearInterval(pingT); pingT = setInterval(() => send({ t: "ping" }), 25000);
      publish(); refreshUI();
    };
    ws.onmessage = ev => { let m; try { m = JSON.parse(ev.data); } catch (e) { return; } onMessage(m); };
    ws.onclose = ev => {
      clearInterval(pingT);
      if (ev.code === 4001) { status = "off"; error = "Phones moved to another screen that opened this game."; ws = null; refreshUI(); return; }
      if (ev.code === 4000) { room = null; saveRoom(); status = "off"; S.links = S.teams.map(() => null); render(); return; }
      if (!opened) return checkGone();
      scheduleRetry();
    };
  }
  async function checkGone() {
    /* Rooms close themselves after a day. If ours is gone, forget it instead of retrying forever. */
    try {
      const r = await fetch(`/api/rooms/${room.code}`);
      if (r.ok && !(await r.json()).exists) { room = null; saveRoom(); status = "off"; S.links = S.teams.map(() => null); render(); return; }
    } catch (e) {}
    scheduleRetry();
  }
  function scheduleRetry() {
    retry++; status = "reconnecting"; refreshUI();
    retryT = setTimeout(connect, Math.min(10000, 500 * 2 ** Math.min(retry, 5)));
  }

  function onMessage(m) {
    if (m.t === "hello") {
      for (const p of m.players || []) players[p.pid] = { name: p.name, online: p.online };
      /* Forget links to phones this room has never seen (for example after opening a new room) */
      let changed = false;
      S.links = S.teams.map((_, i) => { const pid = S.links[i]; if (pid && !players[pid]) { changed = true; return null; } return pid || null; });
      Object.assign(answers, m.answers || {});
      for (const p of m.players || []) if (teamOf(p.pid) < 0) assign(p.pid, p.name);
      for (const [pid, a] of Object.entries(m.answers || {})) take(pid, a, true);
      if (changed) render(); else { save(); publish(); refreshUI(); }
    } else if (m.t === "join") {
      players[m.pid] = { name: m.name, online: true };
      assign(m.pid, m.name);
    } else if (m.t === "presence") {
      if (players[m.pid]) players[m.pid].online = m.online;
      refreshUI();
    } else if (m.t === "answer") {
      answers[m.pid] = { round: m.round, text: m.text };
      take(m.pid, m, false);
    }
  }

  /* Give a phone a team: its old team, else an unused "Team N" slot, else a new team */
  function assign(pid, name) {
    let i = teamOf(pid);
    const inSetup = S.phase === "setup";
    if (i >= 0) {
      if (inSetup && name && S.teams[i] !== name) { S.teams[i] = name; render(); } else publish();
      return;
    }
    if (inSetup) {
      i = S.teams.findIndex((_, k) => !S.links[k] && isDefaultName(k));
      if (i < 0 && S.teams.length < 8) { S.teams.push(name); i = S.teams.length - 1; }
    } else {
      /* Mid-game, a phone can only take over a team with the same name and no phone (a new phone, or a dead battery) */
      i = S.teams.findIndex((t, k) => !S.links[k] && t.trim().toLowerCase() === name.trim().toLowerCase());
    }
    if (i < 0) {
      send({ t: "reject", pid, reason: inSetup ? "The game already has eight teams." : "The game has already started. To rejoin, use your team's exact name, or ask your leader." });
      delete players[pid];
      return;
    }
    S.links[i] = pid;
    if (inSetup) S.teams[i] = name;
    render();
  }

  function take(pid, a, quiet) {
    const i = teamOf(pid);
    if (i < 0 || S.phase !== "round" || a.round !== roundKey()) return;
    if (quiet && (S.drafts[i] || "").trim()) return; /* on reconnect, don't undo the leader's own typing */
    S.drafts[i] = a.text;
    save();
    const inp = document.getElementById(`ans-${i}`);
    if (inp && inp.value !== a.text) inp.value = a.text;
    const tag = document.getElementById(`ph-${i}`);
    if (tag) tag.innerHTML = answerTagHTML(i);
    if (!quiet) publish();
  }

  function kick(pid, reason) {
    if (!pid) return;
    send({ t: "kick", pid, reason });
    delete players[pid]; delete answers[pid];
  }

  /* What phones should show right now */
  function view() {
    const t = totals();
    const teams = S.teams.map((_, i) => ({ name: teamName(i), color: TEAM_COLORS[i] }));
    const standings = S.teams.map((_, i) => ({ team: i, name: teamName(i), color: TEAM_COLORS[i], score: t[i] })).sort((a, b) => b.score - a.score);
    const cat = CAT[S.order[S.round]];
    const base = { round: S.round + 1, total: S.order.length, key: roundKey() };
    let common;
    if (S.phase === "setup") common = { phase: "lobby", teams };
    else if (S.phase === "round") common = { ...base, phase: "round", prompt: cat.prompt, note: cat.note, diff: cat.diff, timer: S.timer ? { len: S.timer, left: T.left, running: T.running } : { len: 0 } };
    else if (S.phase === "reveal") common = { ...base, phase: "reveal", prompt: cat.prompt };
    else if (S.phase === "climb") common = { ...base, phase: "scores", standings };
    else common = { phase: "final", standings };
    const per = {};
    const r = S.phase === "reveal" ? S.history[S.round] : null;
    const pts = r ? roundPoints(r) : [];
    S.links.forEach((pid, i) => {
      if (!pid || i >= S.teams.length) return;
      const mine = { team: i, name: teamName(i), color: TEAM_COLORS[i], score: t[i] };
      if (S.phase === "round") { mine.answer = (S.drafts[i] || "").trim(); mine.round = roundKey(); }
      if (r && r.entries[i]) mine.result = resultFor(r.entries[i], pts[i]);
      per[pid] = mine;
    });
    return { common, per };
  }
  function resultFor(e, pts) {
    const valid = e.d && !e.miss && e.override !== "no";
    let label, tier = 0, detail = "";
    if (!e.text) label = "No answer";
    else if (valid) { tier = e.t; label = TIERS[e.t].name; detail = [norm(e.text) === norm(e.d) ? "" : `Counted as ${e.d}`, e.r].filter(Boolean).join(" · "); }
    else if (e.override === "no") { label = "Not counted"; detail = "The leader ruled this out."; }
    else if (e.override === "yes") { tier = e.ot || 1; label = TIERS[tier].name; detail = "Counted by the leader."; }
    else if (e.miss) { label = "Close, but no"; detail = e.note || ""; }
    else { label = "Not on the list"; detail = "The leader may still count it."; }
    return { text: e.text, label, tier, detail, pts };
  }
  function publish() {
    clearTimeout(soonT);
    headBtn.hidden = !room;
    if (room) headBtn.textContent = `Join: ${room.code}`;
    if (status !== "on") return;
    send({ t: "view", ...view() });
  }
  function publishSoon() { clearTimeout(soonT); soonT = setTimeout(publish, 250); }

  /* ---------- On-screen bits ---------- */
  function statusHTML() {
    const n = S.links.filter(Boolean).length;
    const online = S.links.filter(p => p && players[p] && players[p].online).length;
    if (status === "on") return `<span class="live-stat"><span class="dot on"></span>Open · ${n ? `${online} of ${n} team phone${n === 1 ? "" : "s"} connected` : "No phones yet"}</span>`;
    if (status === "connecting") return `<span class="live-stat"><span class="dot warn"></span>Opening…</span>`;
    return `<span class="live-stat"><span class="dot warn"></span>Reconnecting to the game server…</span>`;
  }
  function setupHTML() {
    if (!room) return `<div class="live" id="live-box">
      <h2>Phones</h2>
      <p class="sub" style="margin:0">Let one person on each team join from their phone with a QR code. They pick the team name and send the team's answers.</p>
      ${error ? `<div class="live-warn">${esc(error)}</div>` : ""}
      <div><button class="btn primary small" type="button" id="live-open" ${status === "connecting" ? "disabled" : ""}>Let teams join by phone</button></div>
    </div>`;
    return `<div class="live" id="live-box">
      <div class="row-between"><h2 style="margin:0">Phones</h2><span id="live-stat">${statusHTML()}</span></div>
      <div class="live-on">
        <img class="qr" src="${esc(qrSrc())}" alt="QR code to join game ${esc(room.code)}" width="150" height="150">
        <div style="display:flex;flex-direction:column;gap:8px;min-width:0">
          <span class="eyebrow">Game code</span>
          <span class="join-code">${esc(room.code)}</span>
          <span class="join-url">${esc(joinURL().replace(/^https?:\/\//, ""))}</span>
          <div class="actions">
            <button class="btn small" type="button" id="live-big">Show on the big screen</button>
            <button class="btn small ghost" type="button" id="live-stop">${stopArmed ? "Click again to stop" : "Stop phones"}</button>
          </div>
        </div>
      </div>
      ${localOnly() ? `<div class="live-warn">Phones can't open “localhost”. Open this page using this computer's network address instead (run <b>npm run dev:lan</b>), or use the published site.</div>` : ""}
      ${error ? `<div class="live-warn">${esc(error)}</div>` : ""}
    </div>`;
  }
  let stopArmed = false;
  function bindSetup() {
    const o = document.getElementById("live-open");
    if (o) o.addEventListener("click", openRoom);
    const b = document.getElementById("live-big");
    if (b) b.addEventListener("click", showDialog);
    const s = document.getElementById("live-stop");
    if (s) s.addEventListener("click", () => {
      if (stopArmed) { stopArmed = false; closeRoom(); return; }
      stopArmed = true; s.textContent = "Click again to stop";
      setTimeout(() => { stopArmed = false; if (s.isConnected) s.textContent = "Stop phones"; }, 3000);
    });
  }
  function badgeHTML(i) {
    const pid = S.links[i];
    if (!pid) return "";
    const on = players[pid] && players[pid].online;
    return `<span class="phone" title="${on ? "Phone connected" : "Phone not connected"}"><span class="dot ${on ? "on" : ""}"></span>Phone</span>`;
  }
  function answerTagHTML(i) {
    const pid = S.links[i];
    if (!pid) return "";
    const a = answers[pid];
    const got = a && a.round === roundKey() && (S.drafts[i] || "").trim();
    const on = players[pid] && players[pid].online;
    return `<span class="phone ${got ? "got" : ""}">${got ? "Sent" : `<span class="dot ${on ? "on" : ""}"></span>Phone`}</span>`;
  }
  const dlg = document.getElementById("join-dlg");
  function showDialog() {
    if (!room) return;
    document.getElementById("join-body").innerHTML = `<div class="join-big">
      <img class="qr" src="${esc(qrSrc())}" alt="QR code to join game ${esc(room.code)}">
      <div style="display:flex;flex-direction:column;gap:14px;min-width:0">
        <ol>
          <li>One person per team scans the code with their phone camera.</li>
          <li>Type your team's name.</li>
          <li>Questions show up on your phone. Send one answer per round.</li>
        </ol>
        <span class="eyebrow">Or go to</span>
        <span class="join-url" style="font-size:1.4rem">${esc(location.host)}/join</span>
        <span class="eyebrow">and enter</span>
        <span class="join-code">${esc(room.code)}</span>
      </div>
    </div>`;
    dlg.showModal();
  }
  document.getElementById("join-close").addEventListener("click", () => dlg.close());
  dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });
  const headBtn = document.getElementById("btn-join");
  headBtn.addEventListener("click", showDialog);

  /* Update the small status pieces without redrawing the screen (so typing isn't interrupted) */
  function refreshUI() {
    headBtn.hidden = !room;
    if (room) headBtn.textContent = `Join: ${room.code}`;
    if (S.phase === "setup") {
      const box = document.getElementById("live-box");
      const stat = document.getElementById("live-stat");
      if (box && (!!room) !== !!stat) { render(); return; }
      if (!room && box) { const o = document.getElementById("live-open"); if (o) o.disabled = status === "connecting"; }
      if (stat) stat.innerHTML = statusHTML();
      S.teams.forEach((_, i) => {
        const row = document.getElementById(`team-${i}`);
        const old = row && row.parentElement.querySelector(".phone");
        const html = badgeHTML(i);
        if (old) old.outerHTML = html || "<span hidden></span>";
        else if (row && html) row.insertAdjacentHTML("afterend", html);
      });
    } else if (S.phase === "round") {
      S.teams.forEach((_, i) => { const tag = document.getElementById(`ph-${i}`); if (tag) tag.innerHTML = answerTagHTML(i); });
    }
  }

  if (room) setTimeout(connect, 0);
  return {
    on: () => !!room, publish, publishSoon, kick, setupHTML, bindSetup, badgeHTML, answerTagHTML,
    linkedCount: () => S.links.filter(Boolean).length
  };
})();

if (S.phase === "round") resetTimer();
render();
</script>
</body>
</html>
